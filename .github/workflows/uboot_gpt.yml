name: U-Boot GPT (Static Device Matrix Trial)

# Temporary trial workflow: production uboot_allinone.yml is not modified.
# One matrix job per device, up to four concurrent jobs; no Releases.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/uboot_gpt.yml"
  workflow_dispatch:

run-name: U-Boot GPT static matrix - ${{ github.event_name }} - all

permissions: write-all

defaults:
  run:
    shell: bash

env:
  CONTAINER_IMAGE: &container_image ubuntu:26.04
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: "true"
  APT_LISTCHANGES_FRONTEND: none
  NEEDRESTART_MODE: a
  FORCE_UNSAFE_CONFIGURE: "1"
  TZ: Etc/UTC
  DISPLAY_TZ: Etc/UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  GIT_TERMINAL_PROMPT: "0"
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  custom_env: ""

jobs:
  runner-image:
    name: ubuntu-latest - runner-image
    runs-on: &step_image ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
      CONTAINER_IMAGE: ${{ env.CONTAINER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  toolchain:
    name: ${{ needs.runner-image.outputs.RUNNER_IMAGE }} - ${{ needs.runner-image.outputs.CONTAINER_IMAGE }} - toolchain
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    container:
      image: *container_image
      options: &container_options >-
        --privileged
        --user=0:0
        --pid=host
        --ipc=host
        --uts=host
        --cgroupns=host
        --cap-add=ALL
        --security-opt apparmor=unconfined
        --security-opt seccomp=unconfined
        --init
        --pids-limit=-1
        --shm-size=12g
        --ulimit nofile=1048576:1048576
      volumes: &container_volumes
        - /dev:/dev
        - /sys:/sys:rw
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
        - /run/udev:/run/udev:ro
        - /lib/modules:/lib/modules:ro
        - /var/run/docker.sock:/var/run/docker.sock
    outputs:
      gcc_version: ${{ steps.resolve-toolchain.outputs.gcc_version }}
      clang_version: ${{ steps.resolve-toolchain.outputs.clang_version }}
      jdk_version: ${{ steps.resolve-toolchain.outputs.jdk_version }}
      custom_env: ${{ steps.resolve-toolchain.outputs.custom_env }}
      upstream_sha: ${{ steps.clone-upstream.outputs.upstream_sha }}
    steps:
      - name: Resolve toolchain versions
        id: resolve-toolchain
        uses: Grinch27/github-actions/.github/actions/resolve-toolchain-version@main


      - name: Install upstream snapshot prerequisites
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends git tar gzip ca-certificates

      - name: Clone upstream once
        id: clone-upstream
        run: |
          set -euo pipefail
          mkdir -p /tmp/uboot-gpt
          git clone --depth=1 --single-branch --branch master \
            https://github.com/hanwckf/bl-mt798x.git \
            /tmp/uboot-gpt/source
          upstream_sha="$(git -C /tmp/uboot-gpt/source rev-parse HEAD)"
          [[ "$upstream_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'upstream_sha=%s\n' "$upstream_sha" >> "$GITHUB_OUTPUT"
          tar -C /tmp/uboot-gpt/source -czf /tmp/uboot-gpt-upstream.tar.gz .
          (cd /tmp && sha256sum uboot-gpt-upstream.tar.gz > uboot-gpt-upstream.tar.gz.sha256)
          ls -lh /tmp/uboot-gpt-upstream.tar.gz

      - name: Upload shared upstream snapshot
        uses: actions/upload-artifact@main
        with:
          name: uboot-gpt-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/uboot-gpt-upstream.tar.gz
            /tmp/uboot-gpt-upstream.tar.gz.sha256
          if-no-files-found: error
          retention-days: 2
  build:
    name: >-
      ${{ needs.runner-image.outputs.RUNNER_IMAGE }} -
      gcc-${{ needs.toolchain.outputs.gcc_version }} -
      ${{ matrix.soc }}_${{ matrix.board }}
    needs:
      - runner-image
      - toolchain
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
        - board: 360t7
          soc: mt7981
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: livinet_zr-3020
          soc: mt7981
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: cetron_ct3003
          soc: mt7981
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: jcg_q30
          soc: mt7981
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: konka_komi-a31
          soc: mt7981
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: wr30u
          soc: mt7981
          multi_layout: "0,1"
          fixed_mtdparts: "0,1"
        - board: imou_lc-hx3001
          soc: mt7981
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: clt_r30b1
          soc: mt7981
          multi_layout: "0,1"
          fixed_mtdparts: "0,1"
        - board: abt_asr3000
          soc: mt7981
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: cmcc_a10
          soc: mt7981
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: cmcc_rax3000m
          soc: mt7981
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: cmcc_rax3000m-emmc
          soc: mt7981
          multi_layout: "0"
          fixed_mtdparts: "0"
        - board: h3c_magic-nx30-pro
          soc: mt7981
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: ax3000t
          soc: mt7981
          multi_layout: "0,1"
          fixed_mtdparts: "0,1"
        - board: redmi_ax6000
          soc: mt7986
          multi_layout: "0,1"
          fixed_mtdparts: "0,1"
        - board: tplink_tl-xdr608x
          soc: mt7986
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: ruijie_rg-x60-pro
          soc: mt7986
          multi_layout: "0,1"
          fixed_mtdparts: "0,1"
        - board: jdcloud_re-cp-03
          soc: mt7986
          multi_layout: "0"
          fixed_mtdparts: "0"
        - board: glinet_gl-mt6000
          soc: mt7986
          multi_layout: "0"
          fixed_mtdparts: "0"
        - board: nokia_ea0326gmp
          soc: mt7981
          multi_layout: "0"
          fixed_mtdparts: "1,0"
        - board: ruijie_rg-x30e
          soc: mt7981
          multi_layout: "0,1"
          fixed_mtdparts: "0,1"
        - board: ruijie_rg-x30e-pro
          soc: mt7981
          multi_layout: "0,1"
          fixed_mtdparts: "0,1"
        - board: tplink_tl-xtr8488
          soc: mt7986
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: newland_nl-wr8103
          soc: mt7981
          multi_layout: "0,1"
          fixed_mtdparts: "0,1"
        - board: honor_fur-602
          soc: mt7981
          multi_layout: "0,1"
          fixed_mtdparts: "0,1"
        - board: newland_nl-wr9103
          soc: mt7981
          multi_layout: "0,1"
          fixed_mtdparts: "0,1"
        - board: cmcc_xr30
          soc: mt7981
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: cmcc_xr30-emmc
          soc: mt7981
          multi_layout: "0"
          fixed_mtdparts: "0"
        - board: zyxel_ex5700
          soc: mt7986
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: openembed_som7981
          soc: mt7981
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: glinet_gl-mt3000
          soc: mt7981
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: glinet_gl-mt2500
          soc: mt7981
          multi_layout: "0"
          fixed_mtdparts: "0"
        - board: ax3000t_an8855
          soc: mt7981
          multi_layout: "0,1"
          fixed_mtdparts: "0,1"
        - board: ruijie_rg-x60
          soc: mt7986
          multi_layout: "0,1"
          fixed_mtdparts: "0,1"
        - board: cudy_tr3000-v1
          soc: mt7981
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: netcore_n60
          soc: mt7986
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: netcore_n60-pro
          soc: mt7986
          multi_layout: "0"
          fixed_mtdparts: "0,1"
        - board: ruijie_ew-6000gx-pro
          soc: mt7986
          multi_layout: "0,1"
          fixed_mtdparts: "0,1"
    container:
      image: *container_image
      options: *container_options
      volumes: *container_volumes
    env:
      # ========= Toolchain Environment Variables ==========
      # ----- gcc -----
      gcc_purge: true
      gcc_install: true
      gcc_switch: false
      gcc_version: ""
      gcc_aarch64: true
      # ----- clang -----
      clang_purge: false
      clang_install: false
      clang_switch: false
      clang_version: ""
      # ----- jdk -----
      jdk_purge: false
      jdk_install: false
      jdk_switch: false
      jdk_version: ""
      # ----- docker -----
      docker_install: false
      qemu_install: false
      # ========= Workspace Environment Variables ==========
      # ----- Repository -----
      REPO_target: "https://github.com/hanwckf/bl-mt798x"
      REPO_target_branch: "master"
      # ----- Build Path -----
      PATH_build: "/builder"
      PATH_target: "/builder/target"
      PATH_output: "/builder/output"
      PATH_backup: "/builder/backup"
    steps:
      - name: Load Custom Environment Variables
        id: env-custom
        uses: Grinch27/github-actions/.github/actions/input-custom@main

      - name: Docker Workspace All in One
        id: docker-workspace
        uses: Grinch27/github-actions/.github/actions/env-indocker@main
      # ========== General Environment Setup: End ==========

      - name: Verify host OpenSSL compatibility
        run: |
          set -euo pipefail
          openssl version
          libssl_version="$(dpkg-query -W -f='${Version}' libssl-dev)"
          printf 'libssl-dev: %s\n' "${libssl_version}"
          libssl_major="${libssl_version%%.*}"
          if [[ ! "${libssl_major}" =~ ^[0-9]+$ ]] || (( libssl_major != 3 )); then
            echo "::error::This U-Boot source requires OpenSSL 3 host headers and libraries; found ${libssl_version}." >&2
            exit 1
          fi


      - name: Download shared upstream snapshot
        uses: actions/download-artifact@main
        with:
          name: uboot-gpt-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PATH_build }}/source-archive

      - name: Restore and verify shared upstream snapshot
        env:
          EXPECTED_UPSTREAM_SHA: ${{ needs.toolchain.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          cd "$PATH_build/source-archive"
          sha256sum -c uboot-gpt-upstream.tar.gz.sha256
          rm -rf -- "$PATH_target"
          mkdir -p "$PATH_target"
          tar -xzf uboot-gpt-upstream.tar.gz -C "$PATH_target"
          actual_sha="$(git -C "$PATH_target" rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_UPSTREAM_SHA" ]]
          test -f "$PATH_target/build.sh"
          command -v python3
          command -v aarch64-linux-gnu-gcc
          printf 'Upstream pinned to %s\n' "$actual_sha"


      - name: Compile U-Boot for ${{ matrix.board }}
        env:
          BUILD_BOARD: ${{ matrix.board }}
          BUILD_SOC: ${{ matrix.soc }}
          MULTI_VALUES: ${{ matrix.multi_layout }}
          FIXED_VALUES: ${{ matrix.fixed_mtdparts }}
        working-directory: ${{ env.PATH_build }}
        run: |
          set -euo pipefail
          mkdir -p "$PATH_backup" "$PATH_output"
          cp -a "$PATH_target" "$PATH_backup/"
          IFS=',' read -r -a multi_values <<< "$MULTI_VALUES"
          IFS=',' read -r -a fixed_values <<< "$FIXED_VALUES"
          for multi in "${multi_values[@]}"; do
            for fixed in "${fixed_values[@]}"; do
              rm -rf -- "$PATH_target"
              cp -a "$PATH_backup/$(basename "$PATH_target")" "$PATH_target"
              (
                cd "$PATH_target"
                SOC="$BUILD_SOC" BOARD="$BUILD_BOARD" \
                  MULTI_LAYOUT="$multi" FIXED_MTDPARTS="$fixed" ./build.sh
                cp -f ./output/*.bin "$PATH_output/"
              )
            done
          done

      - name: Upload device artifacts
        uses: actions/upload-artifact@main
        with:
          name: uboot-gpt-${{ matrix.board }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PATH_output }}/*.bin
          if-no-files-found: error
          retention-days: 7
