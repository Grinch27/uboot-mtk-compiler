name: Call Build

# https://docs.github.com/zh/actions/writing-workflows/workflow-syntax-for-github-actions
run-name: Build Matrix for UBoot

on:
  schedule:
    # Run every day at 20:00 UTC
    - cron: "0 20 * * *"
  repository_dispatch:
  workflow_dispatch:

permissions: write-all

jobs:
  runner-image:
    name: ubuntu-latest - runner-image
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  uboot:
    name: ${{ matrix.workflows_inputs.device_branch }}
    needs: runner-image
    # uses: ./.github/workflows/build-u-boot.yml
    uses: ./.github/workflows/build-u-boot_indocker.yml
    strategy:
      fail-fast: false
      matrix:
        workflows_inputs:
          - device_branch: "all"
    with:
      runner_image: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
      device_branch: ${{ matrix.workflows_inputs.device_branch }}
