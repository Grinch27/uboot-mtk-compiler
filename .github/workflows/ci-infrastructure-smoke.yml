# 待确认：GitHub 当前提供的最新版 Ubuntu x64 Runner 标签是否与项目构建兼容。
# 范围：只验证 Runner 解析、容器运行、基本宿主挂载；禁止业务编译和发布。
# 风险：使用用户指定的 privileged 容器配置；仅在可信仓库事件下执行。
# 验证重点：runner-image 和 container-smoke 两个 Job 均成功。
name: U-Boot CI infrastructure smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-infrastructure-smoke.yml
  workflow_dispatch:

permissions: write-all

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: "true"
  APT_LISTCHANGES_FRONTEND: none
  NEEDRESTART_MODE: a
  FORCE_UNSAFE_CONFIGURE: "1"
  TZ: Etc/UTC
  DISPLAY_TZ: Etc/UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  GIT_TERMINAL_PROMPT: "0"
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

jobs:
  runner-image:
    name: ubuntu-latest - runner-image
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  container-smoke:
    name: ${{ needs.runner-image.outputs.RUNNER_IMAGE }} - ubuntu:devel - smoke
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    container:
      image: &container_image ubuntu:devel
      options: &container_options >-
        --privileged
        --user=0:0
        --pid=host
        --ipc=host
        --uts=host
        --cgroupns=host
        --cap-add=ALL
        --security-opt apparmor=unconfined
        --security-opt seccomp=unconfined
        --init
        --pids-limit=-1
        --shm-size=12g
        --ulimit nofile=1048576:1048576
      volumes: &container_volumes
        - /dev:/dev
        - /sys:/sys:rw
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
        - /run/udev:/run/udev:ro
        - /lib/modules:/lib/modules:ro
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Confirm infrastructure only
        env:
          RESOLVED_RUNNER: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
        run: |
          set -euo pipefail
          [[ "${RESOLVED_RUNNER}" == ubuntu-* ]]
          [[ "$(id -u)" -eq 0 ]]
          test -f /.dockerenv
          test -d /dev
          test -d /sys
          printf 'RUNNER_IMAGE=%s\n' "${RESOLVED_RUNNER}"
          printf 'container=ubuntu:devel\n'
          printf 'user=%s\n' "$(id -un)"
          printf 'No source compilation, artifact upload or release.\n'
